<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>আমি গীতা ইউজ করি</title>
  <meta name="description" content="আমি গীতা ইউজ করি — একটি ছোট ব্যক্তিগত ওয়েবসাইট।" />
  <style>
    :root {
      --ink: #fff8ed;
      --muted: #eadcc8;
      --accent: #ffc857;
      --accent-dark: #e58b2c;
      --bg: #160f2b;
      --card: rgba(255, 255, 255, .1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 200, 87, .28), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(229, 139, 44, .22), transparent 32%),
        linear-gradient(135deg, #160f2b 0%, #2d1450 50%, #111827 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(900px, 100%);
      text-align: center;
      padding: clamp(36px, 8vw, 88px) 24px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 32px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0,0,0,.3);
      backdrop-filter: blur(14px);
    }

    .symbol {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      color: #3b1f08;
      font-size: 38px;
      font-weight: 800;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      box-shadow: 0 10px 30px rgba(255, 200, 87, .25);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 5.2rem);
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    p {
      max-width: 620px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.8;
    }

    .tag {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 18px;
      border-radius: 999px;
      color: #3b1f08;
      font-weight: 700;
      background: var(--accent);
    }

    footer {
      margin-top: 44px;
      color: rgba(255,248,237,.58);
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol">ॐ</div>
    <h1>আমি গীতা ইউজ করি</h1>
    <p>জ্ঞান, শান্তি আর ভালো কাজের পথে এগিয়ে চলাই আমার লক্ষ্য। এই ছোট্ট সাইটটি আমার পরিচয়ের একটি অংশ।</p>
    <div class="tag">শান্তি • জ্ঞান • অনুপ্রেরণা</div>
    <footer>একটি ব্যক্তিগত GitHub Pages সাইট</footer>
  </main>
</body>
</html>
